# Fallow: dead code, circular deps, duplication, complexity, architecture boundaries.
# Docs: https://docs.fallow.tools

entry = [
  "apps/*/src/index.ts",
  "apps/atis/src/cli.ts",
  "apps/web/src/main.ts",
  "libs/*/src/index.ts",
  "apps/*/src/**/*.test.{ts,tsx}",
  "libs/*/src/**/*.test.ts",
  "apps/*/test/**/*.test.ts",
  "libs/*/test/**/*.test.ts",
  "test/**/*.test.ts",
  "scripts/*.ts",
]

# CLI/tooling deps used via command line or config files, not imported from source.
# camera-controls is installed with the web app (C9) and first driven by step 37's
# camera; it needs a DOM to construct, so no Node smoke test can load it before then.
ignoreDependencies = ["@ast-grep/cli", "camera-controls"]

[rules]
unused-exports = "error"
unused-files = "error"
unused-dependencies = "error"
circular-dependencies = "error"
boundary-violation = "error"

[duplicates]
mode = "mild"
minTokens = 50

[health]
maxCyclomatic = 15
maxCognitive = 15

# Architecture boundaries: libs are reusable internals; apps are deployable
# leaves. libs may not import from apps.
[[boundaries.zones]]
name = "apps"
patterns = ["apps/*/src/**"]

[[boundaries.zones]]
name = "libs"
patterns = ["libs/*/src/**"]

[[boundaries.rules]]
from = "libs"
allow = ["libs"]
